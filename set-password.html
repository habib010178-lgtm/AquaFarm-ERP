<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaFarm ERP - Set Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f1f5f9;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}
.logo {
    text-align: center;
    font-size: 42px;
}
h2 {
    text-align: center;
    color: #047857;
    margin-bottom: 8px;
}
.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
}
label {
    display: block;
    margin: 15px 0 7px;
    font-size: 14px;
    font-weight: bold;
}
input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    background: #047857;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}
button:disabled {
    opacity: .6;
    cursor: not-allowed;
}
#message {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
}
.error {
    color: #dc2626;
}
.success {
    color: #047857;
}
.footer {
    text-align: center;
    margin-top: 25px;
    color: #94a3b8;
    font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
<div class="logo">🐟</div>
<h2>AquaFarm ERP</h2>
<p class="subtitle">
    Create Your Farm Owner Account Password
</p>
<form id="passwordForm">
    <label for="password">New Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="8"
        required
    >
    <label for="confirmPassword">Confirm Password</label>
    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        required
    >
    <button type="submit" id="submitBtn">
        Set Password
    </button>
</form>
<p id="message"></p>
<div class="footer">
    AquaFarm ERP &copy; 2026
</div>
</div>
<script>
// ===================================
// SUPABASE CONFIGURATION
// ===================================
const SUPABASE_URL =
"https://qjutiprfupdgyvblzvlc.supabase.co";
const SUPABASE_ANON_KEY =
"sb_publishable_1l7snNDxYv9llPiiaSPEuw_pRerlZv1";
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);
// ===================================
// VERIFY INVITATION SESSION
// ===================================
async function initializePasswordPage() {
    const message = document.getElementById("message");
    try {
        const url = new URL(window.location.href);
        // Handle Supabase PKCE invitation callback
        const code = url.searchParams.get("code");
        if (code) {
            const { error } =
                await supabaseClient.auth.exchangeCodeForSession(code);
            if (error) throw error;
            url.searchParams.delete("code");
            window.history.replaceState({}, "", url.pathname);
        }
        // Handle invitation errors
        const hashParams = new URLSearchParams(
            window.location.hash.substring(1)
        );
        const authError = hashParams.get("error_description");
        if (authError) {
            throw new Error(authError);
        }
        // Check authenticated invitation session
        const { data, error } =
            await supabaseClient.auth.getSession();
        if (error) throw error;
        if (!data.session) {
            message.innerText =
                "Invalid or expired invitation link. Please request a new invitation.";
            message.className = "error";
            document.getElementById("submitBtn").disabled = true;
            return;
        }
        message.innerText =
            "Invitation verified. You can now create your password.";
        message.className = "success";
    } catch (error) {
        console.error(error);
        message.innerText = error.message;
        message.className = "error";
        document.getElementById("submitBtn").disabled = true;
    }
}
// ===================================
// SET NEW PASSWORD
// ===================================
document.getElementById("passwordForm")
.addEventListener("submit", async function(e) {
    e.preventDefault();
    const password =
        document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;
    const message =
        document.getElementById("message");
    const button =
        document.getElementById("submitBtn");
    if (password.length < 8) {
        message.innerText =
            "Password must contain at least 8 characters.";
        message.className = "error";
        return;
    }
    if (password !== confirmPassword) {
        message.innerText =
            "Passwords do not match.";
        message.className = "error";
        return;
    }
    button.disabled = true;
    button.innerText = "Saving Password...";
    try {
        const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) {
            throw new Error(
                "Your invitation session has expired. Please request a new invitation."
            );
        }
        const { error } =
            await supabaseClient.auth.updateUser({
                password: password
            });
        if (error) throw error;
        message.innerText =
            "Password created successfully! You can now log in to AquaFarm ERP.";
        message.className = "success";
        document.getElementById("passwordForm").reset();
        button.innerText = "Password Saved";
    } catch (error) {
        console.error(error);
        message.innerText = error.message;
        message.className = "error";
        button.disabled = false;
        button.innerText = "Set Password";
    }
});
initializePasswordPage();
</script>
</body>
</html>
