<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaFarm ERP - Set Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f1f5f9;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}
.logo { text-align: center; font-size: 42px; }
h2 { text-align: center; color: #047857; margin-bottom: 8px; }
.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
}
label {
    display: block;
    margin: 15px 0 7px;
    font-size: 14px;
    font-weight: bold;
}
input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    background: #047857;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}
button:disabled { opacity: .6; cursor: not-allowed; }
#message {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
}
.error { color: #dc2626; }
.success { color: #047857; }
.footer {
    text-align: center;
    margin-top: 25px;
    color: #94a3b8;
    font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
    <div class="logo">🐟</div>
    <h2>AquaFarm ERP</h2>
    <p class="subtitle">Create Your Farm Owner Account Password</p>
<form id="passwordForm">
    <label for="password">New Password</label>
    <input type="password" id="password"
        placeholder="Enter new password"
        minlength="8" required>
    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8" required>
    <button type="submit" id="submitBtn" disabled>
        Set Password
    </button>
</form>
<p id="message">Verifying invitation...</p>
<div class="footer">AquaFarm ERP &copy; 2026</div>
</div>
<script>
const SUPABASE_URL =
"https://qjutiprfupdgyvblzvlc.supabase.co";
const SUPABASE_ANON_KEY =
"sb_publishable_1l7snNDxYv9llPiiaSPEuw_pRerlZv1";
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");
function showError(text) {
    message.innerText = text;
    message.className = "error";
    button.disabled = true;
}
async function initializePasswordPage() {
    try {
        const url = new URL(window.location.href);
        // Handle PKCE callback if present
        const code = url.searchParams.get("code");
        if (code) {
            const { error } =
                await supabaseClient.auth.exchangeCodeForSession(code);
            if (error) throw error;
            url.searchParams.delete("code");
            window.history.replaceState({}, "", url.pathname);
        }
        // Handle invitation errors
        const hashParams = new URLSearchParams(
            window.location.hash.substring(1)
        );
        const authError =
            hashParams.get("error_description") ||
            hashParams.get("error");
        if (authError) {
            throw new Error(decodeURIComponent(authError));
        }
        // Supabase JS detects the invitation session from URL hash
        const { data, error } =
            await supabaseClient.auth.getSession();
        if (error) throw error;
        if (!data.session) {
            throw new Error(
                "Invalid or expired invitation. Please request a new invitation."
            );
        }
        const { data: userData, error: userError } =
            await supabaseClient.auth.getUser();
        if (userError) throw userError;
        if (!userData.user) {
            throw new Error("Unable to verify your account.");
        }
        message.innerText =
            "Invitation verified. You can now create your password.";
        message.className = "success";
        button.disabled = false;
    } catch (error) {
        console.error(error);
        showError(error.message);
    }
}
document.getElementById("passwordForm")
.addEventListener("submit", async function(e) {
    e.preventDefault();
    const password =
        document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;
    if (password.length < 8) {
        showError("Password must contain at least 8 characters.");
        return;
    }
    if (password !== confirmPassword) {
        showError("Passwords do not match.");
        return;
    }
    button.disabled = true;
    button.innerText = "Saving Password...";
    try {
        const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) {
            throw new Error("Invitation session has expired.");
        }
        // Set new password
        const { error: passwordError } =
            await supabaseClient.auth.updateUser({
                password: password
            });
        if (passwordError) throw passwordError;
        // Activate Farm Admin membership
        const { data: farmId, error: activationError } =
            await supabaseClient.rpc("accept_farm_invitation");
        if (activationError) {
            throw activationError;
        }
        if (!farmId) {
            throw new Error("Farm activation could not be confirmed.");
        }
        message.innerText =
            "Your password has been created and your Farm Owner account is now active!";
        message.className = "success";
        document.getElementById("passwordForm").reset();
        button.innerText = "Account Activated";
        setTimeout(() => {
            window.location.replace("./dashboard.html");
        }, 2500);
    } catch (error) {
        console.error(error);
        message.innerText =
            "Error: " + error.message;
        message.className = "error";
        button.disabled = false;
        button.innerText = "Set Password";
    }
});
initializePasswordPage();
</script>
</body>
</html>
