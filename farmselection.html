<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaFarm ERP - Select Farm</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#064e3b,#059669,#34d399);
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px 30px;
    border-radius:18px;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    font-size:45px;
}

.logo h1{
    color:#047857;
    font-size:27px;
    margin-top:8px;
}

.logo p{
    color:#64748b;
    font-size:12px;
    margin-top:7px;
}

h2{
    text-align:center;
    color:#1e293b;
    font-size:21px;
    margin-bottom:12px;
}

.description{
    text-align:center;
    color:#64748b;
    font-size:14px;
    line-height:1.6;
    margin-bottom:25px;
}

label{
    display:block;
    color:#334155;
    font-size:14px;
    font-weight:bold;
    margin-bottom:9px;
}

select{
    width:100%;
    padding:14px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    background:white;
    font-size:15px;
    margin-bottom:20px;
    outline:none;
}

select:focus{
    border-color:#059669;
}

button{
    width:100%;
    padding:14px;
    background:#059669;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#047857;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#message{
    margin-top:17px;
    text-align:center;
    font-size:14px;
    line-height:1.6;
}

.logout{
    margin-top:12px;
    background:#e2e8f0;
    color:#334155;
}

.logout:hover{
    background:#cbd5e1;
}

.footer{
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    margin-top:25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">🐟</div>
        <h1>AquaFarm ERP</h1>
        <p>Fish Farming Management & Accounting System</p>
    </div>

    <h2>Select Your Farm</h2>

    <p class="description">
        Please select the farm you want to manage.
        All dashboard modules will operate under your selected farm.
    </p>

    <form id="farmForm">

        <label for="farmSelect">Choose Your Farm</label>

        <select id="farmSelect" required disabled>
            <option value="">Loading your farms...</option>
        </select>

        <button type="submit" id="continueBtn" disabled>
            Continue to Dashboard
        </button>

    </form>

    <div id="message"></div>

    <button type="button" class="logout" id="logoutBtn">
        Logout
    </button>

    <div class="footer">
        © 2026 AquaFarm ERP. All Rights Reserved.
    </div>

</div>

<script>

// SUPABASE CONFIGURATION

const SUPABASE_URL =
"https://qjutiprfupdgyvblzvlc.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_1l7snNDxYv9llPiiaSPEuw_pRerlZv1";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// GLOBAL VARIABLES

let farmList = [];
let membershipsList = [];
let currentUserId = null;


// MESSAGE

function showMessage(message,color="#64748b"){

    const box = document.getElementById("message");

    box.style.color = color;
    box.textContent = message;

}


// LOAD AUTHORIZED FARMS

async function initializeFarmSelection(){

    const farmSelect = document.getElementById("farmSelect");
    const continueBtn = document.getElementById("continueBtn");

    try{

        showMessage("Checking your login...");

        const {data,error} =
            await supabaseClient.auth.getSession();

        if(error) throw error;

        if(!data.session){

            window.location.replace("index.html");
            return;

        }

        currentUserId = data.session.user.id;


        // Load active memberships

        const {data:memberships,error:memberError} =
            await supabaseClient

            .from("farm_members")

            .select("farm_id,role")

            .eq("user_id",currentUserId)

            .eq("status","active");

        if(memberError) throw memberError;

        membershipsList = memberships || [];

        const farmIds = membershipsList.map(
            item => item.farm_id
        );

        if(!farmIds.length){

            throw new Error(
                "No active farm membership found."
            );

        }


        // Load active farms

        const {data:farms,error:farmError} =
            await supabaseClient

            .from("farms")

            .select("id,farm_code,farm_name,status")

            .in("id",farmIds)

            .eq("status","active")

            .order("created_at",{ascending:true});

        if(farmError) throw farmError;

        farmList = farms || [];

        if(!farmList.length){

            throw new Error("No active farm found.");

        }


        // Populate dropdown

        farmSelect.innerHTML =
            '<option value="">-- Select Your Farm --</option>';

        farmList.forEach(farm => {

            const option = document.createElement("option");

            option.value = farm.id;
            option.textContent = farm.farm_name;

            farmSelect.appendChild(option);

        });

        farmSelect.disabled = false;
        continueBtn.disabled = false;

        showMessage(
            farmList.length + " authorized farm(s) found.",
            "#059669"
        );

    }catch(error){

        console.error("Farm Selection Error:",error);

        farmSelect.innerHTML =
            '<option value="">Unable to load farms</option>';

        farmSelect.disabled = true;
        continueBtn.disabled = true;

        showMessage(error.message,"#dc2626");

    }

}


// SELECT FARM

document.getElementById("farmForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const selectedFarmId =
        document.getElementById("farmSelect").value;

    if(!selectedFarmId){

        showMessage(
            "Please select a farm first.",
            "#dc2626"
        );

        return;

    }

    const selectedFarm = farmList.find(
        farm => farm.id === selectedFarmId
    );

    if(!selectedFarm){

        showMessage(
            "Invalid farm selection.",
            "#dc2626"
        );

        return;

    }

    const membership = membershipsList.find(
        item => item.farm_id === selectedFarmId
    );

    if(!membership){

        showMessage(
            "Farm membership verification failed.",
            "#dc2626"
        );

        return;

    }

    // Save selected farm

    localStorage.setItem(
        "aquafarm_active_farm_id",
        selectedFarm.id
    );

    localStorage.setItem(
        "aquafarm_active_farm_name",
        selectedFarm.farm_name
    );

    localStorage.setItem(
        "aquafarm_active_farm_role",
        membership.role
    );

    const button = document.getElementById("continueBtn");

    button.disabled = true;
    button.textContent = "Opening Dashboard...";

    window.location.replace("dashboard.html");

});


// LOGOUT

document.getElementById("logoutBtn")
.addEventListener("click",async function(){

    this.disabled = true;
    this.textContent = "Logging out...";

    try{

        await supabaseClient.auth.signOut();

        localStorage.removeItem("aquafarm_active_farm_id");
        localStorage.removeItem("aquafarm_active_farm_name");
        localStorage.removeItem("aquafarm_active_farm_role");

        window.location.replace("index.html");

    }catch(error){

        showMessage(error.message,"#dc2626");

        this.disabled = false;
        this.textContent = "Logout";

    }

});


// START

initializeFarmSelection();

</script>

</body>
</html>
