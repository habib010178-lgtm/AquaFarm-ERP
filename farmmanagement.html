<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AquaFarm ERP - Farm Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f0fdf4;
    color: #1e293b;
}

.header {
    background: #064e3b;
    color: white;
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    color: #6ee7b7;
}

.header a {
    color: white;
    text-decoration: none;
    background: #059669;
    padding: 10px 16px;
    border-radius: 7px;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 20px;
}

.page-title {
    margin-bottom: 20px;
}

.page-title h2 {
    color: #065f46;
    margin-bottom: 7px;
}

.page-title p {
    color: #64748b;
    font-size: 14px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,.05);
}

.card h3 {
    color: #065f46;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #e2e8f0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group label {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #475569;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #059669;
}

.form-group input:disabled {
    background: #f1f5f9;
    color: #64748b;
}

.full-width {
    grid-column: 1 / -1;
}

textarea {
    min-height: 85px;
    resize: vertical;
}

.status-box {
    background: #ecfdf5;
    padding: 15px;
    border-radius: 8px;
    color: #047857;
    font-weight: bold;
}

.buttons {
    margin-top: 22px;
    display: flex;
    gap: 10px;
}

button {
    border: none;
    padding: 12px 22px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.save-btn {
    background: #059669;
    color: white;
}

.save-btn:hover {
    background: #047857;
}

.save-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.cancel-btn {
    background: #e2e8f0;
    color: #334155;
}

#message {
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
}

.success {
    color: #047857;
}

.error {
    color: #dc2626;
}

.info {
    background: #eff6ff;
    border-left: 4px solid #2563eb;
    padding: 14px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.6;
}

@media(max-width:650px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .full-width {
        grid-column: auto;
    }

    .header {
        padding: 15px;
    }

    .container {
        padding: 0 12px;
    }

    .card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header class="header">

    <h2>🐟 AquaFarm ERP</h2>

    <a href="dashboard.html">← Dashboard</a>

</header>

<div class="container">

    <div class="page-title">
        <h2>Farm Management</h2>
        <p>Manage your farm profile and contact information.</p>
    </div>

    <div class="info">
        You can update your farm profile information here.
        Farm Code and Farm Status are controlled by the Platform Super Admin.
    </div>

    <div class="card">

        <h3>Farm Selection</h3>

        <div class="form-group">
            <label>Select Farm</label>

            <select id="farmSelect" onchange="selectFarm()">
                <option value="">Loading farms...</option>
            </select>
        </div>

    </div>

    <div class="card">

        <h3>Farm Information</h3>

        <div class="form-grid">

            <div class="form-group">
                <label>Farm Name</label>
                <input type="text" id="farmName" placeholder="Enter farm name">
            </div>

            <div class="form-group">
                <label>Farm Code</label>
                <input type="text" id="farmCode" disabled>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="farmPhone" placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="farmEmail" placeholder="Enter email address">
            </div>

            <div class="form-group full-width">
                <label>Farm Address</label>
                <textarea id="farmAddress" placeholder="Enter farm address"></textarea>
            </div>

            <div class="form-group">
                <label>Currency</label>
                <select id="farmCurrency">
                    <option value="BDT">BDT - Bangladeshi Taka</option>
                    <option value="USD">USD - US Dollar</option>
                </select>
            </div>

            <div class="form-group">
                <label>Timezone</label>
                <input type="text" id="farmTimezone">
            </div>

            <div class="form-group">
                <label>Farm Status</label>
                <div class="status-box" id="farmStatus">-</div>
            </div>

        </div>

        <div class="buttons">

            <button class="save-btn" id="saveBtn" onclick="saveFarm()">
                Save Changes
            </button>

            <button class="cancel-btn" onclick="loadSelectedFarm()">
                Cancel
            </button>

        </div>

        <p id="message"></p>

    </div>

    <div class="card">

        <h3>Farm Owner Information</h3>

        <div class="form-grid">

            <div class="form-group">
                <label>Login Email</label>
                <input type="text" id="ownerEmail" disabled>
            </div>

            <div class="form-group">
                <label>Account Name</label>
                <input type="text" id="ownerName" disabled>
            </div>

            <div class="form-group">
                <label>Account Role</label>
                <input type="text" id="ownerRole" disabled>
            </div>

        </div>

    </div>

</div>

<script>

// =====================================
// SUPABASE CONFIGURATION
// =====================================

const SUPABASE_URL =
"https://qjutiprfupdgyvblzvlc.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_1l7snNDxYv9llPiiaSPEuw_pRerlZv1";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// =====================================
// GLOBAL VARIABLES
// =====================================

let currentUser = null;
let farmList = [];
let currentFarm = null;
let currentRole = null;


// =====================================
// INITIALIZATION
// =====================================

async function initializePage() {

    try {

        const { data, error } =
            await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
            window.location.replace("index.html");
            return;
        }

        currentUser = data.session.user;

        document.getElementById("ownerEmail").value =
            currentUser.email || "-";

        // Load account profile

        const { data: profile, error: profileError } =
            await supabaseClient
            .from("user_profiles")
            .select("full_name")
            .eq("id", currentUser.id)
            .maybeSingle();

        if (profileError) throw profileError;

        document.getElementById("ownerName").value =
            profile?.full_name || "-";

        // Load farm memberships

        const { data: memberships, error: memberError } =
            await supabaseClient
            .from("farm_members")
            .select("farm_id, role, status")
            .eq("user_id", currentUser.id)
            .eq("status", "active");

        if (memberError) throw memberError;

        if (!memberships || memberships.length === 0) {
            throw new Error("No active farm membership found.");
        }

        const farmIds = memberships.map(m => m.farm_id);

        // Load accessible farms

        const { data: farms, error: farmError } =
            await supabaseClient
            .from("farms")
            .select("id, farm_code, farm_name, address, phone, email, currency, timezone, status")
            .in("id", farmIds)
            .order("created_at", { ascending: true });

        if (farmError) throw farmError;

        if (!farms || farms.length === 0) {
            throw new Error("No accessible farm found.");
        }

        farmList = farms.map(farm => {

            const membership = memberships.find(
                m => m.farm_id === farm.id
            );

            return {
                ...farm,
                role: membership?.role || ""
            };

        });

        const selector = document.getElementById("farmSelect");

        selector.innerHTML = farmList.map(farm => `
            <option value="${escapeHTML(farm.id)}">
                ${escapeHTML(farm.farm_name)}
            </option>
        `).join("");

        // Select first accessible farm

        selector.value = farmList[0].id;

        await loadSelectedFarm();

    } catch (error) {

        console.error(error);

        showMessage(error.message, "error");

    }

}


// =====================================
// SELECT FARM
// =====================================

async function selectFarm() {

    const farmId =
        document.getElementById("farmSelect").value;

    currentFarm = farmList.find(
        f => f.id === farmId
    );

    if (!currentFarm) return;

    await loadSelectedFarm();

}


// =====================================
// LOAD FARM DETAILS
// =====================================

async function loadSelectedFarm() {

    const farmId =
        document.getElementById("farmSelect").value;

    currentFarm = farmList.find(
        f => f.id === farmId
    );

    if (!currentFarm) return;

    currentRole = currentFarm.role;

    document.getElementById("farmName").value =
        currentFarm.farm_name || "";

    document.getElementById("farmCode").value =
        currentFarm.farm_code || "";

    document.getElementById("farmPhone").value =
        currentFarm.phone || "";

    document.getElementById("farmEmail").value =
        currentFarm.email || "";

    document.getElementById("farmAddress").value =
        currentFarm.address || "";

    document.getElementById("farmCurrency").value =
        currentFarm.currency || "BDT";

    document.getElementById("farmTimezone").value =
        currentFarm.timezone || "Asia/Dhaka";

    document.getElementById("farmStatus").innerText =
        currentFarm.status || "-";

    document.getElementById("ownerRole").value =
        currentRole.toUpperCase();

    const isAdmin = currentRole === "admin";

    document.getElementById("saveBtn").disabled =
        !isAdmin;

    document.querySelectorAll(
        "#farmName, #farmPhone, #farmEmail, #farmAddress, #farmCurrency, #farmTimezone"
    ).forEach(input => {
        input.disabled = !isAdmin;
    });

    showMessage(
        isAdmin
        ? "You can manage this farm profile."
        : "Only Farm Admin can edit farm information.",
        isAdmin ? "success" : "error"
    );

}


// =====================================
// SAVE FARM INFORMATION
// =====================================

async function saveFarm() {

    if (!currentFarm || currentRole !== "admin") {
        showMessage("Permission denied.", "error");
        return;
    }

    const button = document.getElementById("saveBtn");

    button.disabled = true;
    button.innerText = "Saving...";

    try {

        const farmName =
            document.getElementById("farmName").value.trim();

        const phone =
            document.getElementById("farmPhone").value.trim();

        const email =
            document.getElementById("farmEmail").value.trim();

        const address =
            document.getElementById("farmAddress").value.trim();

        const currency =
            document.getElementById("farmCurrency").value;

        const timezone =
            document.getElementById("farmTimezone").value.trim();

        if (!farmName) {
            throw new Error("Farm Name is required.");
        }

        const updates = {
            farm_name: farmName,
            phone: phone || null,
            email: email || null,
            address: address || null,
            currency: currency,
            timezone: timezone || "Asia/Dhaka"
        };

        const { error } =
            await supabaseClient
            .from("farms")
            .update(updates)
            .eq("id", currentFarm.id);

        if (error) throw error;

        // Update local farm information

        Object.assign(currentFarm, updates);

        showMessage(
            "Farm information updated successfully!",
            "success"
        );

    } catch (error) {

        console.error(error);

        showMessage(error.message, "error");

    } finally {

        button.disabled = currentRole !== "admin";
        button.innerText = "Save Changes";

    }

}


// =====================================
// MESSAGE
// =====================================

function showMessage(message, type) {

    const element =
        document.getElementById("message");

    element.innerText = message;

    element.className = type;

}


// =====================================
// HTML ESCAPE
// =====================================

function escapeHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, char => {

        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];

    });

}


// =====================================
// START APPLICATION
// =====================================

initializePage();

</script>

</body>
</html>
