<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaFarm ERP - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #064e3b, #059669, #34d399);
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 35px 30px;
    border-radius: 18px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.2);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-icon {
    font-size: 48px;
}

.logo h1 {
    color: #047857;
    font-size: 28px;
    margin-top: 8px;
}

.logo p {
    color: #64748b;
    font-size: 13px;
    margin-top: 7px;
}

h2 {
    text-align: center;
    color: #1e293b;
    margin-bottom: 25px;
    font-size: 21px;
}

label {
    display: block;
    color: #334155;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #059669;
}

button {
    width: 100%;
    padding: 14px;
    background: #059669;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #047857;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
}

.footer {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <div class="logo-icon">🐟</div>
        <h1>AquaFarm ERP</h1>
        <p>Fish Farming Management & Accounting System</p>
    </div>

    <h2>Admin Login</h2>

    <form id="loginForm">

        <label>Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" id="loginBtn">
            Login to AquaFarm
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        © 2026 AquaFarm ERP. All Rights Reserved.
    </div>

</div>

<script>

// =================================
// SUPABASE CONFIGURATION
// =================================

const SUPABASE_URL = "https://qjutiprfupdgyvblzvlc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1l7snNDxYv9llPiiaSPEuw_pRerlZv1";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

// =================================
// LOGIN SYSTEM
// =================================

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const button = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    button.disabled = true;
    button.innerText = "Logging in...";
    message.style.color = "#64748b";
    message.innerText = "Please wait...";

    try {

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        message.style.color = "#059669";
        message.innerHTML = `
            <strong>Login Successful!</strong><br>
            Welcome to AquaFarm ERP.
        `;

        button.innerText = "Login Successful";

        console.log("Logged in user:", data.user);

    } catch (error) {

        message.style.color = "#dc2626";
        message.innerText = error.message;

        button.disabled = false;
        button.innerText = "Login to AquaFarm";

    }

});

</script>

</body>
</html>
